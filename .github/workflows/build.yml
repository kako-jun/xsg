name: Build XSG

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [created]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: pip install uv

      - name: Build Frontend
        run: |
          cd frontend
          npm install
          npm run build

      - name: Build Backend
        run: |
          cd backend
          ./build_windows.bat

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xsg-windows
          path: |
            backend/dist/XSG.exe
            backend/dist/XSG.scr

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: pip install uv

      - name: Build Frontend
        run: |
          cd frontend
          npm install
          npm run build

      - name: Build Backend
        run: |
          cd backend
          chmod +x build_linux.sh
          ./build_linux.sh

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xsg-linux
          path: backend/dist/xsg-linux-x64.tar.gz

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: pip install uv

      - name: Build Frontend
        run: |
          cd frontend
          npm install
          npm run build

      - name: Build Backend
        run: |
          cd backend
          chmod +x build_macos.sh
          ./build_macos.sh

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xsg-macos
          path: |
            backend/dist/XSG.app
            backend/dist/XSG-macOS-x64.dmg

  release:
    needs: [build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    steps:
      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: xsg-windows
          path: windows

      - name: Download Linux Artifacts
        uses: actions/download-artifact@v4
        with:
          name: xsg-linux
          path: linux

      - name: Download macOS Artifacts
        uses: actions/download-artifact@v4
        with:
          name: xsg-macos
          path: macos

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v1
        with:
          files: |
            windows/XSG.exe
            windows/XSG.scr
            linux/xsg-linux-x64.tar.gz
            macos/XSG-macOS-x64.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
